<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#14212b;--muted:#5d6b76;--line:#d5dde2;--ok:#0f6b5c;--bad:#c4372b;--accent:#2457c5;--okbg:#dff2ee;--badbg:#fbe4e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}main{max-width:1000px;margin:auto;padding:clamp(16px,4vw,32px)}h1{font-size:clamp(27px,5vw,36px);margin:0 0 4px;letter-spacing:-.03em}.sub{color:var(--muted);margin:0 0 16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button,input,select,textarea{font:inherit}button{cursor:pointer}nav button,.secondary{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);padding:9px 14px}nav button[aria-pressed=true]{background:var(--ink);color:#fff}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{border:0;border-radius:8px;background:var(--ok);color:white;padding:10px 16px;font-weight:650;min-height:42px}.secondary{border-radius:8px}.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}.hero small{display:block;color:var(--muted);font-size:14px;margin-bottom:8px}.big{font-size:clamp(30px,6vw,40px);font-weight:750;line-height:1.1;letter-spacing:-.03em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px}.week,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.week.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.week h2{font-size:16px;margin:0;padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.week.drop-target{outline:3px dashed var(--accent);outline-offset:2px}.row,.bill-row,.editor-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}.row .date{width:64px;flex:none;color:var(--muted);font-size:13px}.row .name,.bill-row .name{flex:1;min-width:0;overflow-wrap:anywhere}.row.paid .name,.row.paid .amount{text-decoration:line-through;color:var(--muted)}.row input[type=checkbox]{width:19px;height:19px;accent-color:var(--ok);flex:none}.payment-row{cursor:grab;touch-action:pan-y}.payment-row.dragging{opacity:.42}.drag-handle{color:var(--muted);font-size:18px;user-select:none}.tot,.foot{display:flex;justify-content:space-between;gap:10px;padding:11px 14px}.tot{color:var(--muted)}.foot{font-weight:650}.foot.pos{background:var(--okbg);color:var(--ok)}.foot.neg,.danger{background:var(--badbg);color:var(--bad)}.panel{padding:16px;margin-bottom:16px}.panel h2{font-size:18px;margin:0 0 12px}.rowlist{margin:0 -16px}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.controls label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:13px}.controls input,.controls select,.editor-row input,.bill-row input,.paste,.ocr-row input{border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:9px 10px;min-height:42px}.controls input[type=number]{width:140px}.hint{color:var(--muted);font-size:13px;margin:10px 0 0}.bill-row input{width:150px;flex:none}.bill-row input[type=number]{width:88px}.delete{border:0;background:transparent;color:var(--bad);font-size:22px;padding:4px 8px}.editor-row input:first-child{flex:1;min-width:90px}.editor-row input[type=number]{width:130px}.paste{width:100%;min-height:100px;resize:vertical}.empty{padding:14px;color:var(--muted)}.ocr-image{display:block;max-width:100%;max-height:300px;object-fit:contain;margin:12px 0;border-radius:8px}.ocr-row{display:grid;grid-template-columns:auto minmax(130px,1fr) minmax(120px,1fr) minmax(90px,130px);gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.ocr-row input[type=checkbox]{width:20px;height:20px}.ocr-text{width:100%;min-height:130px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}[hidden]{display:none!important}@media(max-width:520px){main{padding:16px}.hero{gap:16px;padding:16px}.big{font-size:32px}.bill-row{gap:6px;padding:9px 8px}.bill-row input{width:128px}.ocr-row{grid-template-columns:auto 1fr 1fr}.ocr-row input[data-ocr-amount]{grid-column:2/4;width:100%}}

<body><main><h1>Payday Planner</h1><p class="sub">Your weekly income, fixed costs and every upcoming payment in one place.</p><p id="installWrap" hidden><button class="primary" id="installBtn">Install app on this phone</button></p><nav id="tabs" aria-label="Planner sections"></nav><div id="view" aria-live="polite"></div></main>
<script>
(function(){'use strict';
const KEY='payday-planner-v1',today=new Date(),days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const fromISO=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const weekStart=(d,weekday)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()-weekday+7)%7));return x};
const fmt=d=>d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
const money=n=>(Number(n)<0?'-':'')+'$'+Math.abs(Number(n)||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function seed(){return{payday:3,income:[{n:'O',a:800},{n:'A',a:1106}],weekly:[{n:'Rent',a:600},{n:'HCF',a:66},{n:'Gym',a:46.95},{n:'Petrol',a:100},{n:'Grocery',a:100},{n:'Loan',a:216}],bills:[{id:uid(),n:'Spotify',a:19.99,rec:true,day:2},{id:uid(),n:'Car loan',a:1131.74,rec:true,day:6},{id:uid(),n:'Car insurance',a:220,rec:true,day:26},{id:uid(),n:'Comm CC',a:35,rec:true,day:29},{id:uid(),n:'Coles CC',a:84.27,rec:true,day:12},{id:uid(),n:'NAB CC',a:35,rec:true,day:2},{id:uid(),n:'Drivernote',a:13.5,rec:true,day:28},{id:uid(),n:'Netflix',a:21,rec:true,day:29},{id:uid(),n:'Zippay',a:100,rec:true,day:27},{id:uid(),n:'Zipmoney',a:120,rec:true,day:30},{id:uid(),n:'Steppay',a:73.5,rec:false,d:iso(addDays(weekStart(today,3),2))},{id:uid(),n:'Electricity',a:150,rec:false,d:iso(addDays(weekStart(today,3),12))}],paid:{},moves:{}}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){state=null}if(!state||!Array.isArray(state.bills))state=seed();if(!Array.isArray(state.income))state.income=seed().income;if(!Array.isArray(state.weekly))state.weekly=seed().weekly;if(!state.paid||typeof state.paid!=='object')state.paid={};if(!state.moves||typeof state.moves!=='object')state.moves={};if(!Number.isInteger(state.payday)||state.payday<0||state.payday>6)state.payday=3;state.bills.forEach(b=>{if(!b.id)b.id=uid();if(!Number.isFinite(Number(b.a)))b.a=0});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};const sum=items=>items.reduce((t,x)=>t+(Number(x.a)||0),0),budget=()=>sum(state.income)-sum(state.weekly);
let tab='weeks';const tabs=[['weeks','Upcoming weeks'],['add','Add payments'],['bills','All bills'],['budget','Weekly budget']];
function occurrences(start){const end=addDays(start,6),out=[];state.bills.forEach(b=>{if(b.rec){const monthCursor=new Date(start.getFullYear(),start.getMonth()-1,1),monthEnd=new Date(end.getFullYear(),end.getMonth()+2,1);for(let month=new Date(monthCursor);month<monthEnd;month.setMonth(month.getMonth()+1)){const last=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),nominal=new Date(month.getFullYear(),month.getMonth(),Math.min(Number(b.day)||1,last)),key=b.id+'@'+iso(nominal),effective=state.moves[key]?fromISO(state.moves[key]):nominal;if(effective>=start&&effective<=end)out.push({bill:b,date:effective,key})}}else{const original=fromISO(b.d),key=b.id+'@'+iso(original),effective=state.moves[key]?fromISO(state.moves[key]):original;if(effective>=start&&effective<=end)out.push({bill:b,date:effective,key})}});return out.sort((a,b)=>a.date-b.date)}
function renderWeeks(){const base=budget(),start=weekStart(today,state.payday),current=occurrences(start),unpaid=current.filter(x=>!state.paid[x.key]).reduce((t,x)=>t+(Number(x.bill.a)||0),0),all=current.reduce((t,x)=>t+(Number(x.bill.a)||0),0);let html='<div class="hero"><div><small>Free each pay period after fixed costs</small><div class="big">'+money(base)+'</div></div><div><small>Still to pay this pay period</small><div class="big">'+money(unpaid)+'</div></div><div><small>Left this pay period after all bills</small><div class="big '+(base-all<0?'danger':'')+'">'+money(base-all)+'</div></div></div><p class="hint">Move payments by dragging rows between pay periods. For monthly bills, only that occurrence moves.</p><div class="grid">';for(let w=0;w<8;w++){const from=addDays(start,w*7),to=addDays(from,6),list=occurrences(from),total=list.reduce((t,x)=>t+(Number(x.bill.a)||0),0),remaining=base-total;html+='<section class="week '+(w===0?'current':'')+'" data-week-start="'+iso(from)+'"><h2><span>'+fmt(from)+' – '+fmt(to)+'</span><span>'+(w===0?'Current pay period':'')+'</span></h2>';if(!list.length)html+='<div class="empty">No payments this pay period. Drop a payment here to move it.</div>';list.forEach(x=>{const paid=!!state.paid[x.key];html+='<div class="row payment-row '+(paid?'paid':'')+'" draggable="true" data-occurrence="'+esc(x.key)+'" data-occ-date="'+iso(x.date)+'" title="Drag to move this payment occurrence"><span class="drag-handle" aria-hidden="true">⋮⋮</span><input type="checkbox" data-paid="'+esc(x.key)+'" '+(paid?'checked':'')+' aria-label="Mark '+esc(x.bill.n)+' paid"><span class="date">'+x.date.toLocaleDateString('en-AU',{weekday:'short'})+' '+x.date.getDate()+'</span><span class="name">'+esc(x.bill.n)+(x.bill.rec&&state.moves[x.key]?' <small>(moved once)</small>':'')+'</span><span class="amount">'+money(x.bill.a)+'</span></div>'});html+='<div class="tot"><span>Total payments</span><span>'+money(total)+'</span></div><div class="foot '+(remaining<0?'neg':'pos')+'"><span>'+(remaining<0?'Short by':'Remainder')+'</span><span>'+money(remaining)+'</span></div></section>'}return html+'</div>'}
function renderAdd(){return '<section class="panel"><h2>Add one payment</h2><div class="controls"><label>Name<input id="billName" placeholder="Electricity" maxlength="80"></label><label>Amount<input id="billAmount" type="number" min="0" step="0.01" placeholder="0.00"></label><label>Repeats<select id="billRepeat"><option value="once">Once</option><option value="monthly">Every month</option></select></label><label>Date / first due date<input id="billDate" type="date" value="'+iso(today)+'"></label><button class="primary" id="addBill">Add payment</button></div></section><section class="panel"><h2>Paste payments</h2><textarea id="pasteInput" class="paste" placeholder="18/11 Electricity 73.50&#10;26/11 Car insurance 220.00"></textarea><p class="hint">One payment per line: date (day/month), name, then amount.</p><p><button class="primary" id="pasteBills">Add pasted payments</button> <span id="pasteStatus" class="hint" role="status"></span></p></section><section class="panel"><h2>Upload a payment screenshot</h2><p class="hint">Choose a clear screenshot/photo of upcoming payments. Text recognition runs in your browser; the image is not uploaded to a server. Check the extracted details before importing.</p><label class="controls">Image<input id="paymentImage" type="file" accept="image/*"></label><img id="imagePreview" class="ocr-image" alt="Selected payment screenshot" hidden><p><button class="primary" id="readImage" disabled>Read screenshot</button> <span id="ocrStatus" class="hint" role="status"></span></p><label for="ocrText">Recognized text (edit if needed)</label><textarea id="ocrText" class="ocr-text" placeholder="Choose a picture, then tap Read screenshot."></textarea><p><button class="secondary" id="parseOcr">Find payment rows</button></p><div id="ocrResults"></div><p id="ocrImportWrap" hidden><button class="primary" id="importOcr">Add selected payments</button></p></section>'}
function renderBills(){const bills=state.bills.slice().sort((a,b)=>(a.rec?Number(a.day):32)-(b.rec?Number(b.day):32)),monthly=sum(state.bills.filter(b=>b.rec));return '<section class="panel"><h2>All bills</h2><p class="hint">Monthly bills total '+money(monthly)+'. Update a due date or amount, or remove a payment.</p><div class="rowlist">'+(bills.length?bills.map(b=>'<div class="bill-row"><span class="name">'+esc(b.n)+' <span class="tag">'+(b.rec?'Monthly':'One-off')+'</span></span><input data-bill-date="'+esc(b.id)+'" type="'+(b.rec?'number':'date')+'" '+(b.rec?'min="1" max="31" value="'+esc(b.day)+'"':'value="'+esc(b.d||'')+'"')+' aria-label="Due date for '+esc(b.n)+'"><input data-bill-amount="'+esc(b.id)+'" type="number" min="0" step="0.01" value="'+Number(b.a||0)+'" aria-label="Amount for '+esc(b.n)+'"><button class="delete" data-delete="'+esc(b.id)+'" aria-label="Delete '+esc(b.n)+'">×</button></div>').join(''):'<p class="empty">No payments yet. Add one from Add payments.</p>')+'</div></section>'}
function editorRows(key){return state[key].map((x,i)=>'<div class="editor-row"><input data-name="'+key+'" data-index="'+i+'" value="'+esc(x.n)+'" aria-label="Name"><input data-amount="'+key+'" data-index="'+i+'" type="number" min="0" step="0.01" value="'+Number(x.a||0)+'" aria-label="Amount"><button class="delete" data-remove="'+key+'" data-index="'+i+'" aria-label="Remove item">×</button></div>').join('')}
function renderBudget(){return '<section class="panel"><h2>Payday and pay period</h2><label class="controls">Payday / first day of pay period<select id="payday">'+days.map((d,i)=>'<option value="'+i+'" '+(state.payday===i?'selected':'')+'>'+d+'</option>').join('')+'</select></label><p class="hint">Each pay period starts on this weekday and runs for seven days.</p></section><section class="panel"><h2>Weekly income · '+money(sum(state.income))+'</h2><div class="rowlist">'+editorRows('income')+'</div><p><button class="secondary" data-add="income">+ Add income</button></p></section><section class="panel"><h2>Weekly fixed costs · '+money(sum(state.weekly))+'</h2><div class="rowlist">'+editorRows('weekly')+'</div><p><button class="secondary" data-add="weekly">+ Add cost</button></p><p class="hint">Free money each pay period after fixed costs: <strong>'+money(budget())+'</strong></p></section>'}
function moveOccurrence(key,sourceDate,targetWeek){const source=fromISO(sourceDate),week=fromISO(targetWeek),weekdayOffset=Math.round((source-weekStart(source,state.payday))/86400000),destination=addDays(week,Math.max(0,Math.min(6,weekdayOffset)));if(iso(destination)===iso(source))return;state.moves[key]=iso(destination);save();render()}
function bindDragDrop(view){let dragged=null;view.querySelectorAll('[data-occurrence]').forEach(row=>{row.addEventListener('dragstart',event=>{dragged={key:row.dataset.occurrence,date:row.dataset.occDate};row.classList.add('dragging');event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',row.dataset.occurrence)});row.addEventListener('dragend',()=>{row.classList.remove('dragging');view.querySelectorAll('.drop-target').forEach(card=>card.classList.remove('drop-target'));dragged=null})});view.querySelectorAll('[data-week-start]').forEach(card=>{card.addEventListener('dragover',event=>{event.preventDefault();event.dataTransfer.dropEffect='move';card.classList.add('drop-target')});card.addEventListener('dragleave',event=>{if(!card.contains(event.relatedTarget))card.classList.remove('drop-target')});card.addEventListener('drop',event=>{event.preventDefault();card.classList.remove('drop-target');const key=event.dataTransfer.getData('text/plain');if(dragged&&key===dragged.key)moveOccurrence(key,dragged.date,card.dataset.weekStart)})})}
function dateFromText(day,month,year){const monthNum=Number(month)||(['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].findIndex(m=>String(month).toLowerCase().startsWith(m))+1);if(monthNum<1||monthNum>12)return null;let y=year?Number(year):today.getFullYear();if(y<100)y+=2000;let d=new Date(y,monthNum-1,Number(day));if(!year&&d<addDays(today,-45))d=new Date(y+1,monthNum-1,Number(day));if(d.getDate()!==Number(day)||d.getMonth()!==monthNum-1)return null;return iso(d)}
function parseOcrRows(){const text=document.getElementById('ocrText').value,rows=[];text.split(/\r?\n/).forEach(line=>{line=line.trim().replace(/\s+/g,' ');if(!line)return;let m=line.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\s+(.+?)\s+\$?(-?[\d,]+(?:\.\d{1,2})?)$/);if(m){const date=dateFromText(m[1],m[2],m[3]);const amount=Number(m[5].replace(/,/g,''));if(date&&Number.isFinite(amount))rows.push({date,name:m[4],amount});return}m=line.match(/^(\d{1,2})\s+([A-Za-z]{3,9})\s+(.+?)\s+\$?(-?[\d,]+(?:\.\d{1,2})?)$/);if(m){const date=dateFromText(m[1],m[2].slice(0,3),null),amount=Number(m[4].replace(/,/g,''));if(date&&Number.isFinite(amount))rows.push({date,name:m[3],amount})}});const result=document.getElementById('ocrResults'),wrap=document.getElementById('ocrImportWrap');if(!rows.length){result.innerHTML='<p class="hint">No payment rows recognized. Edit the text above into this format and try again: <strong>18/11 Electricity 73.50</strong></p>';wrap.hidden=true;return}result.innerHTML=rows.map((r,i)=>'<div class="ocr-row"><input type="checkbox" data-ocr-select="'+i+'" checked aria-label="Import this row"><input data-ocr-name="'+i+'" value="'+esc(r.name)+'" aria-label="Payment name"><input data-ocr-date="'+i+'" type="date" value="'+r.date+'" aria-label="Due date"><input data-ocr-amount="'+i+'" type="number" min="0" step="0.01" value="'+Number(r.amount.toFixed(2))+'" aria-label="Amount"></div>').join('');wrap.hidden=false}
function render(){const nav=document.getElementById('tabs');nav.innerHTML=tabs.map(t=>'<button type="button" data-tab="'+t[0]+'" aria-pressed="'+(tab===t[0])+'">'+t[1]+'</button>').join('');const view=document.getElementById('view');view.innerHTML=tab==='weeks'?renderWeeks():tab==='add'?renderAdd():tab==='bills'?renderBills():renderBudget();nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});bindDragDrop(view);view.querySelectorAll('[data-paid]').forEach(c=>c.onchange=()=>{if(c.checked)state.paid[c.dataset.paid]=1;else delete state.paid[c.dataset.paid];save();render()});
const add=document.getElementById('addBill');if(add)add.onclick=()=>{const n=document.getElementById('billName').value.trim(),a=Number(document.getElementById('billAmount').value),d=document.getElementById('billDate').value,rec=document.getElementById('billRepeat').value==='monthly';if(!n||!d||!Number.isFinite(a)||a<0){alert('Enter a name, a valid amount, and a date.');return}state.bills.push(rec?{id:uid(),n,a,rec:true,day:Number(d.slice(-2))}:{id:uid(),n,a,rec:false,d});save();tab='weeks';render()};
const paste=document.getElementById('pasteBills');if(paste)paste.onclick=()=>{let added=0,bad=0;document.getElementById('pasteInput').value.split(/\r?\n/).forEach(line=>{line=line.trim();if(!line)return;const m=line.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\s+(.+?)\s+\$?([\d,]*\.?\d+)$/);if(!m){bad++;return}let year=m[3]?Number(m[3]):today.getFullYear();if(year<100)year+=2000;let date=new Date(year,Number(m[2])-1,Number(m[1]));if(!m[3]&&date<addDays(weekStart(today,state.payday),-30))date=new Date(year+1,Number(m[2])-1,Number(m[1]));if(date.getDate()!==Number(m[1])){bad++;return}state.bills.push({id:uid(),n:m[4],a:Number(m[5].replace(/,/g,'')),rec:false,d:iso(date)});added++});save();document.getElementById('pasteStatus').textContent=added+' added; '+bad+' line(s) could not be read.';if(added){tab='weeks';render()}};
const imageInput=document.getElementById('paymentImage');if(imageInput)imageInput.onchange=()=>{const file=imageInput.files&&imageInput.files[0],preview=document.getElementById('imagePreview'),button=document.getElementById('readImage');if(!file)return;if(!file.type.startsWith('image/')){document.getElementById('ocrStatus').textContent='Please choose an image file.';return}preview.src=URL.createObjectURL(file);preview.hidden=false;button.disabled=false;document.getElementById('ocrStatus').textContent='Image ready. OCR runs locally in this browser.'};
const readButton=document.getElementById('readImage');if(readButton)readButton.onclick=async()=>{const file=imageInput.files&&imageInput.files[0];if(!file)return;const status=document.getElementById('ocrStatus');readButton.disabled=true;status.textContent='Loading text recognition… (internet is required the first time)';try{if(!window.Tesseract){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.onload=resolve;script.onerror=()=>reject(new Error('Could not load OCR library. Check your internet connection.'));document.head.appendChild(script)})}status.textContent='Reading image…';const worker=await Tesseract.createWorker('eng');const result=await worker.recognize(file);await worker.terminate();document.getElementById('ocrText').value=result.data.text||'';status.textContent='Text read. Check it below, then choose “Find payment rows”.';}catch(error){status.textContent=error.message||'Could not read the image. You can paste or type payment lines below.'}finally{readButton.disabled=false}};
const parseButton=document.getElementById('parseOcr');if(parseButton)parseButton.onclick=parseOcrRows;
const importButton=document.getElementById('importOcr');if(importButton)importButton.onclick=()=>{const rows=Array.from(document.querySelectorAll('.ocr-row'));let count=0;rows.forEach(row=>{const checkbox=row.querySelector('[data-ocr-select]');if(!checkbox||!checkbox.checked)return;const name=row.querySelector('[data-ocr-name]').value.trim(),date=row.querySelector('[data-ocr-date]').value,amount=Number(row.querySelector('[data-ocr-amount]').value);if(!name||!date||!Number.isFinite(amount)||amount<0)return;state.bills.push({id:uid(),n:name,a:amount,rec:false,d:date});count++});save();if(count){tab='weeks';render()}else document.getElementById('ocrStatus').textContent='Select at least one valid payment row to import.'};
view.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{state.bills=state.bills.filter(x=>x.id!==b.dataset.delete);save();render()});view.querySelectorAll('[data-bill-date]').forEach(input=>input.onchange=()=>{const bill=state.bills.find(x=>x.id===input.dataset.billDate);if(!bill)return;if(bill.rec){const day=Number(input.value);if(!Number.isInteger(day)||day<1||day>31){alert('Enter a day from 1 to 31.');render();return}bill.day=day}else bill.d=input.value;save();render()});view.querySelectorAll('[data-bill-amount]').forEach(input=>input.onchange=()=>{const bill=state.bills.find(x=>x.id===input.dataset.billAmount);if(!bill)return;const amount=Number(input.value);if(input.value.trim()===''||!Number.isFinite(amount)||amount<0){alert('Enter a valid amount of zero or more.');render();return}bill.a=amount;save();render()});const payday=document.getElementById('payday');if(payday)payday.onchange=()=>{state.payday=Number(payday.value);save();render()};view.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{state[b.dataset.add].push({n:'New item',a:0});save();render()});view.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state[b.dataset.remove].splice(Number(b.dataset.index),1);save();render()});view.querySelectorAll('[data-name]').forEach(i=>i.onchange=()=>{state[i.dataset.name][Number(i.dataset.index)].n=i.value;save();render()});view.querySelectorAll('[data-amount]').forEach(i=>i.onchange=()=>{state[i.dataset.amount][Number(i.dataset.index)].a=Number(i.value)||0;save();render()})}
render();let installPrompt;const installWrap=document.getElementById('installWrap');window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;installWrap.hidden=false});document.getElementById('installBtn').onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installWrap.hidden=true};window.addEventListener('appinstalled',()=>{installWrap.hidden=true});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
