<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Payday Planner</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#14212b">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Payday">
  <style>
    :root {
      --bg: #eef2f4;
      --card: #ffffff;
      --ink: #14212b;
      --muted: #5d6b76;
      --line: #d5dde2;
      --ok: #0f6b5c;
      --bad: #c4372b;
      --acc: #2457c5;
      --okbg: #dff2ee;
      --badbg: #fbe4e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 "Avenir Next", Avenir, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      font-size: 32px;
      margin: 4px 0 12px;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      margin: 0 0 18px;
      font-size: 18px;
    }
    .hero {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .hero .big {
      font-size: 38px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .hero small {
      display: block;
      color: var(--muted);
      margin-bottom: 6px;
      font-size: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .week {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .week h3 {
      margin: 0;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
    }
    .row .nm { flex: 1; min-width: 0; }
    .row .dt { width: 56px; color: var(--muted); font-size: 12px; }
    .tot, .foot {
      display: flex; justify-content: space-between;
      padding: 10px 12px;
    }
    .foot.pos { background: var(--okbg); color: var(--ok); }
    .foot.neg { background: var(--badbg); color: var(--bad); }
    .pos { color: var(--ok); }
    .neg { color: var(--bad); }
    .btn {
      background: var(--ok);
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Payday Planner</h1>
    <p class="sub">Your weekly income, fixed costs and every upcoming payment in one place.</p>
    <p id="installWrap" class="hidden"><button class="btn" id="installBtn">Install app on this phone</button></p>
    <div id="view"></div>
  </main>

  <script>
    const state = {
      payday: 3,
      income: [
        { name: 'O', amount: 800 },
        { name: 'A', amount: 1106 }
      ],
      weekly: [
        { name: 'Rent', amount: 600 },
        { name: 'HCF', amount: 66 },
        { name: 'Gym', amount: 46.95 },
        { name: 'Petrol', amount: 100 },
        { name: 'Grocery', amount: 100 },
        { name: 'Loan', amount: 216 }
      ],
      bills: [
        { name: 'Spotify', amount: 19.99, due: '2026-11-02' },
        { name: 'Car loan', amount: 1131.74, due: '2026-11-06' },
        { name: 'Electricity', amount: 150, due: '2026-11-12' }
      ]
    };

    function money(value) {
      const sign = value < 0 ? '-' : '';
      return sign + '$' + Math.abs(value).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function sum(items) {
      return items.reduce(function (total, item) {
        return total + Number(item.amount || 0);
      }, 0);
    }
    function render() {
      const base = sum(state.income) - sum(state.weekly);
      const totalBills = state.bills.reduce(function (total, item) {
        return total + Number(item.amount || 0);
      }, 0);

      document.getElementById('view').innerHTML = (
        '<div class="hero">' +
          '<div><small>Free each pay period after fixed costs</small><span class="big">' + money(base) + '</span></div>' +
          '<div><small>Still to pay this pay period</small><span class="big">' + money(totalBills) + '</span></div>' +
          '<div><small>Left this pay period after all bills</small><span class="big ' + ((base - totalBills) < 0 ? 'neg' : 'pos') + '">' + money(base - totalBills) + '</span></div>' +
        '</div>' +
        '<div class="grid">' +
          '<section class="week"><h3><span>Current pay period</span><span>Now</span></h3>' +
          state.bills.map(function (bill) {
            return '<div class="row"><span class="dt">' + bill.due.slice(5) + '</span><span class="nm">' + bill.name + '</span><span class="am">' + money(bill.amount) + '</span></div>';
          }).join('') +
          '<div class="tot"><span>Total payments</span><span>' + money(totalBills) + '</span></div>' +
          '<div class="foot ' + ((base - totalBills) < 0 ? 'neg' : 'pos') + '"><span>' + ((base - totalBills) < 0 ? 'Short by' : 'Remainder') + '</span><span>' + money(base - totalBills) + '</span></div>' +
          '</section>' +
        '</div>'
      );
    }

    document.addEventListener('DOMContentLoaded', render);

    let deferredPrompt = null;
    const installWrap = document.getElementById('installWrap');
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      deferredPrompt = event;
      if (installWrap) installWrap.classList.remove('hidden');
    });

    if (installBtn) {
      installBtn.addEventListener('click', async function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (installWrap) installWrap.classList.add('hidden');
      });
    }

    window.addEventListener('appinstalled', function () {
      if (installWrap) installWrap.classList.add('hidden');
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
