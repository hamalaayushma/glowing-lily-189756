<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payday Planner</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#14212b">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Payday">
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#14212b;--mute:#5d6b76;--line:#d5dde2;--ok:#0f6b5c;--bad:#c4372b;--acc:#2457c5;--okbg:#dff2ee;--badbg:#fbe4e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161c;--card:#17222a;--ink:#e6edf1;--mute:#93a3ae;--line:#2a3944;--ok:#4fc3ab;--bad:#ff8a7c;--acc:#7da2ff;--okbg:#12342d;--badbg:#3b1f1b}}
:root[data-theme="dark"]{--bg:#0e161c;--card:#17222a;--ink:#e6edf1;--mute:#93a3ae;--line:#2a3944;--ok:#4fc3ab;--bad:#ff8a7c;--acc:#7da2ff;--okbg:#12342d;--badbg:#3b1f1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next",Avenir,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 14px}
nav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
nav button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.hero .big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1}
.hero small{display:block;color:var(--mute);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.week{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.week.now{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.week h3{margin:0;padding:10px 12px;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line)}
.row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.row .dt{color:var(--mute);font-size:12px;width:44px}
.row.paid .nm,.row.paid .am{text-decoration:line-through;color:var(--mute)}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok)}
.empty{padding:12px;color:var(--mute)}
.foot{padding:10px 12px;display:flex;justify-content:space-between;font-weight:600}
.foot.pos{background:var(--okbg);color:var(--ok)}.foot.neg{background:var(--badbg);color:var(--bad)}
.tot{display:flex;justify-content:space-between;padding:8px 12px;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.panel h2{font-size:16px;margin:0 0 10px}
.f{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{width:100%;min-height:90px}
.btn{background:var(--ok);color:#fff;border:0;padding:9px 16px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer}
html:not([data-theme]) .btn{color:#fff}
.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:16px;padding:2px 6px}
.list .row{padding:8px 4px}
.tag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0}
.bill-date{width:150px;flex:none}
</style>
</head>
<body>
<main>
<h1>Payday Planner</h1>
<p class="sub">Your weekly income, fixed costs and every upcoming payment in one place.</p>
<p id="inst" hidden><button class="btn" id="instb">Install app on this phone</button></p>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<script>
const KEY="payday-planner-v1";
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const money=n=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const weekStartOf=(d,startDay)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()-startDay+7)%7));return x};
const fmtD=d=>d.toLocaleDateString("en-AU",{day:"numeric",month:"short"});
const today=new Date();
const uid=()=>Math.random().toString(36).slice(2,9);
const days=[[0,"Sunday"],[1,"Monday"],[2,"Tuesday"],[3,"Wednesday"],[4,"Thursday"],[5,"Friday"],[6,"Saturday"]];

const seed=()=>({
  payday:3,
  income:[{n:"O",a:800},{n:"A",a:1106}],
  weekly:[{n:"Rent",a:600},{n:"HCF",a:66},{n:"Gym",a:46.95},{n:"Petrol",a:100},{n:"Grocery",a:100},{n:"Loan",a:216}],
  bills:[
   {id:uid(),n:"Spotify",a:19.99,rec:true,day:2},{id:uid(),n:"Car loan",a:1131.74,rec:true,day:6},
   {id:uid(),n:"Car insurance",a:220,rec:true,day:26},{id:uid(),n:"Comm CC",a:35,rec:true,day:29},
   {id:uid(),n:"Coles CC",a:84.27,rec:true,day:12},{id:uid(),n:"NAB CC",a:35,rec:true,day:2},
   {id:uid(),n:"Drivernote",a:13.5,rec:true,day:28},{id:uid(),n:"Netflix",a:21,rec:true,day:29},
   {id:uid(),n:"Zippay",a:100,rec:true,day:27},{id:uid(),n:"Zipmoney",a:120,rec:true,day:30},
   {id:uid(),n:"Steppay",a:73.5,rec:false,d:iso(addD(weekStartOf(today,3),2))},
   {id:uid(),n:"Electricity",a:150,rec:false,d:iso(addD(weekStartOf(today,3),12))}
  ],paid:{}
});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.bills)S=seed();
if(!Number.isInteger(S.payday)||S.payday<0||S.payday>6)S.payday=3;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const currentStart=()=>weekStartOf(today,S.payday);

const sum=l=>l.reduce((t,x)=>t+(+x.a||0),0);
const budget=()=>sum(S.income)-sum(S.weekly);
function occ(start){
  const out=[];
  for(let i=0;i<7;i++){const d=addD(start,i),k=iso(d);
   S.bills.forEach(b=>{
    const hit=b.rec?d.getDate()===+b.day:b.d===k;
    if(hit)out.push({b,k,d});
   });}
  return out;
}
let tab="weeks";
function nav(){
  const t=[["weeks","Upcoming weeks"],["add","Add payments"],["bills","All bills"],["budget","Weekly budget"]];
  document.getElementById("nav").innerHTML=t.map(([k,l])=>`<button aria-pressed="${tab===k}" data-t="${k}">${l}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
}
function weeks(){
  const base=budget();let h="";const start=currentStart();
  const w0=occ(start);const tot0=w0.reduce((t,o)=>t+o.b.a,0);
  const left=w0.filter(o=>!S.paid[o.b.id+"@"+o.k]).reduce((t,o)=>t+o.b.a,0);
  h+=`<div class="hero"><div><small>Free each pay period after fixed costs</small><span class="big">${money(base)}</span></div>
  <div><small>Still to pay this pay period</small><span class="big">${money(left)}</span></div>
  <div><small>Left this pay period after all bills</small><span class="big ${base-tot0<0?"neg":"pos"}">${money(base-tot0)}</span></div></div><div class="grid">`;
  for(let w=0;w<8;w++){
   const st=addD(start,w*7),en=addD(st,6),o=occ(st),tot=o.reduce((t,x)=>t+x.b.a,0),rem=base-tot;
   h+=`<section class="week ${w===0?"now":""}"><h3><span>${fmtD(st)} – ${fmtD(en)}</span><span>${w===0?"Current pay period":""}</span></h3>`;
   h+=o.length?o.map(x=>{const pk=x.b.id+"@"+x.k;return `<label class="row ${S.paid[pk]?"paid":""}"><input type="checkbox" data-p="${pk}" ${S.paid[pk]?"checked":""} aria-label="Mark ${esc(x.b.n)} paid" ><span class="dt">${x.d.toLocaleDateString("en-AU",{weekday:"short"})} ${x.d.getDate()}</span><span class="nm">${esc(x.b.n)}</span><span class="am">${money(x.b.a)}</span></label>`}).join(""):`<div class="empty">No payments this pay period.</div>`;
   h+=`<div class="tot"><span>Total payments</span><span>${money(tot)}</span></div><div class="foot ${rem<0?"neg":"pos"}"><span>${rem<0?"Short by":"Remainder"}</span><span>${money(rem)}</span></div></section>`;
  }
  return h+"</div>";
}
function addView(){
  return `<div class="panel"><h2>Add one payment</h2><div class="f">
  <label>Name<input id="n" placeholder="Steppay"></label>
  <label>Amount<input id="a" type="number" step="0.01" min="0" placeholder="0.00"></label>
  <label>Repeats<select id="r"><option value="0">Once</option><option value="1">Every month</option></select></label>
  <label>Date (or first due date)<input id="d" type="date" value="${iso(today)}"></label>
  <button class="btn" id="addb">Add payment</button></div></div>
  <div class="panel"><h2>Paste from your bank</h2>
  <textarea id="paste" placeholder="18/11 Steppay 73.50&#10;26/11 Car insurance 220.00"></textarea>
  <p class="hint">One payment per line: date (day/month), name, then amount. Each line is added as a one-off payment.</p>
  <p><button class="btn" id="pastb">Add pasted payments</button> <span id="msg" class="hint"></span></p></div>`;
}
function billsView(){
  const rows=[...S.bills].sort((a,b)=>(a.rec?+a.day:0)-(b.rec?+b.day:0)||0);
  const mo=sum(S.bills.filter(b=>b.rec));
  return `<div class="panel list"><h2>All bills</h2><p class="hint">Monthly bills total ${money(mo)}. Change a date below to move a payment to another day or pay period.</p>`+rows.map(b=>`<div class="row"><span class="nm">${esc(b.n)} <span class="tag">${b.rec?"Monthly":"One-off"}</span></span><input class="bill-date" data-bill="${b.id}" aria-label="${esc(b.n)} due date" type="${b.rec?"number":"date"}" ${b.rec?`min="1" max="31" value="${b.day}"`:`value="${esc(b.d)}"`}><span>${money(b.a)}</span><button class="x" data-del="${b.id}" aria-label="Delete ${esc(b.n)}">×</button></div>`).join("")+`</div>`;
}
function listEditor(key,title,note){
  return `<div class="panel list"><h2>${title}</h2>`+S[key].map((x,i)=>`<div class="row"><input data-k="${key}" data-i="${i}" data-f="n" value="${esc(x.n)}" style="flex:1" aria-label="Name"><input data-k="${key}" data-i="${i}" data-f="a" type="number" step="0.01" value="${x.a}" style="width:110px" aria-label="Amount"><button class="x" data-rm="${key}:${i}" aria-label="Remove">×</button></div>`).join("")+`<p><button class="btn ghost" data-ad="${key}">Add row</button></p><p class="hint">${note}</p></div>`;
}
function budgetView(){
  const dayOptions=days.map(([value,label])=>`<option value="${value}" ${S.payday===value?"selected":""}>${label}</option>`).join("");
  return `<div class="panel"><h2>Payday and pay period</h2><div class="f"><label for="payday">Payday / first day of pay period<select id="payday">${dayOptions}</select></label></div><p class="hint">Each pay period starts on payday and runs for seven days, ending the day before your next payday.</p></div>`+listEditor("income","Weekly income","Total "+money(sum(S.income)))+listEditor("weekly","Weekly fixed costs","Total "+money(sum(S.weekly))+". Free money per week: "+money(budget()));
}
function render(){
  nav();const v=document.getElementById("view");
  v.innerHTML=tab==="weeks"?weeks():tab==="add"?addView():tab==="bills"?billsView():budgetView();
  v.querySelectorAll("[data-p]").forEach(c=>c.onchange=()=>{c.checked?S.paid[c.dataset.p]=1:delete S.paid[c.dataset.p];save();render()});
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.bills=S.bills.filter(x=>x.id!==b.dataset.del);save();render()});
  v.querySelectorAll("[data-bill]").forEach(input=>input.onchange=()=>{const bill=S.bills.find(x=>x.id===input.dataset.bill);if(!bill)return;if(bill.rec){const day=parseInt(input.value,10);if(!Number.isInteger(day)||day<1||day>31){alert("Enter a day from 1 to 31.");render();return}bill.day=day}else{if(!input.value)return;bill.d=input.value}save();render()});
  const payday=document.getElementById("payday");if(payday)payday.onchange=()=>{S.payday=Number(payday.value);save();render()};
  v.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const[k,i]=b.dataset.rm.split(":");S[k].splice(+i,1);save();render()});
  v.querySelectorAll("[data-ad]").forEach(b=>b.onclick=()=>{S[b.dataset.ad].push({n:"New item",a:0});save();render()});
  v.querySelectorAll("[data-f]").forEach(i=>i.onchange=()=>{const it=S[i.dataset.k][+i.dataset.i];it[i.dataset.f]=i.dataset.f==="a"?(parseFloat(i.value)||0):i.value;save();render()});
  const ab=document.getElementById("addb");
  if(ab)ab.onclick=()=>{
   const n=document.getElementById("n").value.trim(),a=parseFloat(document.getElementById("a").value),d=document.getElementById("d").value,r=document.getElementById("r").value==="1";
   if(!n||isNaN(a)||!d){alert("Enter a name, an amount and a date.");return}
   S.bills.push(r?{id:uid(),n,a,rec:true,day:parse(d).getDate()}:{id:uid(),n,a,rec:false,d});
   save();tab="weeks";render();
  };
  const pb=document.getElementById("pastb");
  if(pb)pb.onclick=()=>{
   let ok=0,bad=0;
   document.getElementById("paste").value.split("\n").forEach(line=>{
    line=line.trim();if(!line)return;
    const m=line.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\s+(.+?)\s+\$?(-?[\d,]*\.?\d+)$/);
    if(!m){bad++;return}
    let y=m[3]?+m[3]:today.getFullYear();if(y<100)y+=2000;
    let dt=new Date(y,+m[2]-1,+m[1]);
    if(!m[3]&&dt<addD(currentStart(),-30))dt=new Date(y+1,+m[2]-1,+m[1]);
    S.bills.push({id:uid(),n:m[4],a:Math.abs(parseFloat(m[5].replace(/,/g,""))),rec:false,d:iso(dt)});ok++;
   });
   save();
   if(bad===0&&ok){tab="weeks";render()}else document.getElementById("msg").textContent=ok+" added. "+bad+" line(s) could not be read. Use: 18/11 Name 73.50";
  };
}
render();
let dp;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;document.getElementById("inst").hidden=false});
document.getElementById("instb").onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;document.getElementById("inst").hidden=true};
addEventListener("appinstalled",()=>{document.getElementById("inst").hidden=true});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
