<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14212b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Payday">
<title>Payday Planner</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#14212b;--muted:#5d6b76;--line:#d5dde2;--ok:#0f6b5c;--bad:#c4372b;--accent:#2457c5;--okbg:#dff2ee;--badbg:#fbe4e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}main{max-width:1000px;margin:auto;padding:clamp(16px,4vw,32px)}h1{font-size:clamp(27px,5vw,36px);margin:0 0 4px;letter-spacing:-.03em}.sub{color:var(--muted);margin:0 0 16px}.install{margin:0 0 16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button,input,select,textarea{font:inherit}button{cursor:pointer}nav button,.secondary{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);padding:9px 14px}nav button[aria-pressed=true]{background:var(--ink);color:#fff}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{border:0;border-radius:8px;background:var(--ok);color:white;padding:10px 16px;font-weight:650;min-height:42px}.secondary{border-radius:8px}.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}.hero small{display:block;color:var(--muted);font-size:14px;margin-bottom:8px}.big{font-size:clamp(30px,6vw,40px);font-weight:750;line-height:1.1;letter-spacing:-.03em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px}.week,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.week.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.week h2{font-size:16px;margin:0;padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.row,.bill-row,.editor-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}.row .date{width:64px;flex:none;color:var(--muted);font-size:13px}.row .name,.bill-row .name{flex:1;min-width:0;overflow-wrap:anywhere}.row.paid .name,.row.paid .amount{text-decoration:line-through;color:var(--muted)}.row input[type=checkbox]{width:19px;height:19px;accent-color:var(--ok);flex:none}.tot,.foot{display:flex;justify-content:space-between;gap:10px;padding:11px 14px}.tot{color:var(--muted)}.foot{font-weight:650}.foot.pos{background:var(--okbg);color:var(--ok)}.foot.neg,.danger{background:var(--badbg);color:var(--bad)}.panel{padding:16px;margin-bottom:16px}.panel h2{font-size:18px;margin:0 0 12px}.rowlist{margin:0 -16px}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.controls label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:13px}.controls input,.controls select,.editor-row input,.bill-row input,.paste{border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:9px 10px;min-height:42px}.controls input[type=number]{width:140px}.hint{color:var(--muted);font-size:13px;margin:10px 0 0}.bill-row input{width:150px;flex:none}.bill-row input[type=number]{width:88px}.delete{border:0;background:transparent;color:var(--bad);font-size:22px;padding:4px 8px}.editor-row input:first-child{flex:1;min-width:90px}.editor-row input[type=number]{width:130px}.paste{width:100%;min-height:100px;resize:vertical}.empty{padding:14px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:520px){main{padding:16px}.hero{gap:16px;padding:16px}.big{font-size:32px}.bill-row{gap:6px;padding:9px 8px}.bill-row input{width:128px}}
</style>
</head>
<body>
<main>
<h1>Payday Planner</h1>
<p class="sub">Your weekly income, fixed costs and every upcoming payment in one place.</p>
<p class="install" id="installWrap" hidden><button class="primary" id="installBtn">Install app on this phone</button></p>
<nav id="tabs" aria-label="Planner sections"></nav>
<div id="view" aria-live="polite"></div>
</main>
<script>
(function(){
'use strict';
const KEY='payday-planner-v1',today=new Date(),days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const weekStart=(d,weekday)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()-weekday+7)%7));return x};
const fmt=d=>d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
const money=n=>(Number(n)<0?'-':'')+'$'+Math.abs(Number(n)||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function seed(){return{payday:3,income:[{n:'O',a:800},{n:'A',a:1106}],weekly:[{n:'Rent',a:600},{n:'HCF',a:66},{n:'Gym',a:46.95},{n:'Petrol',a:100},{n:'Grocery',a:100},{n:'Loan',a:216}],bills:[{id:uid(),n:'Spotify',a:19.99,rec:true,day:2},{id:uid(),n:'Car loan',a:1131.74,rec:true,day:6},{id:uid(),n:'Car insurance',a:220,rec:true,day:26},{id:uid(),n:'Comm CC',a:35,rec:true,day:29},{id:uid(),n:'Coles CC',a:84.27,rec:true,day:12},{id:uid(),n:'NAB CC',a:35,rec:true,day:2},{id:uid(),n:'Drivernote',a:13.5,rec:true,day:28},{id:uid(),n:'Netflix',a:21,rec:true,day:29},{id:uid(),n:'Zippay',a:100,rec:true,day:27},{id:uid(),n:'Zipmoney',a:120,rec:true,day:30},{id:uid(),n:'Steppay',a:73.5,rec:false,d:iso(addDays(weekStart(today,3),2))},{id:uid(),n:'Electricity',a:150,rec:false,d:iso(addDays(weekStart(today,3),12))}],paid:{}}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){state=null}if(!state||!Array.isArray(state.bills))state=seed();if(!Array.isArray(state.income))state.income=seed().income;if(!Array.isArray(state.weekly))state.weekly=seed().weekly;if(!state.paid||typeof state.paid!=='object')state.paid={};if(!Number.isInteger(state.payday)||state.payday<0||state.payday>6)state.payday=3;state.bills.forEach(b=>{if(!b.id)b.id=uid();if(!Number.isFinite(Number(b.a)))b.a=0});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const sum=items=>items.reduce((t,x)=>t+(Number(x.a)||0),0),budget=()=>sum(state.income)-sum(state.weekly);
let tab='weeks';const tabs=[['weeks','Upcoming weeks'],['add','Add payments'],['bills','All bills'],['budget','Weekly budget']];
function occurrences(start){const out=[];for(let i=0;i<7;i++){const date=addDays(start,i),key=iso(date);state.bills.forEach(b=>{const match=b.rec?date.getDate()===Math.min(Number(b.day)||1,new Date(date.getFullYear(),date.getMonth()+1,0).getDate()):b.d===key;if(match)out.push({bill:b,date,key})})}return out}
function renderWeeks(){const base=budget(),start=weekStart(today,state.payday),current=occurrences(start),unpaid=current.filter(x=>!state.paid[x.bill.id+'@'+x.key]).reduce((t,x)=>t+(Number(x.bill.a)||0),0),all=current.reduce((t,x)=>t+(Number(x.bill.a)||0),0);let html='<div class="hero"><div><small>Free each pay period after fixed costs</small><div class="big">'+money(base)+'</div></div><div><small>Still to pay this pay period</small><div class="big">'+money(unpaid)+'</div></div><div><small>Left this pay period after all bills</small><div class="big '+(base-all<0?'danger':'')+'">'+money(base-all)+'</div></div></div><div class="grid">';for(let w=0;w<8;w++){const from=addDays(start,w*7),to=addDays(from,6),list=occurrences(from),total=list.reduce((t,x)=>t+(Number(x.bill.a)||0),0),remaining=base-total;html+='<section class="week '+(w===0?'current':'')+'"><h2><span>'+fmt(from)+' – '+fmt(to)+'</span><span>'+(w===0?'Current pay period':'')+'</span></h2>';if(!list.length)html+='<div class="empty">No payments this pay period.</div>';list.forEach(x=>{const key=x.bill.id+'@'+x.key,paid=!!state.paid[key];html+='<label class="row '+(paid?'paid':'')+'"><input type="checkbox" data-paid="'+esc(key)+'" '+(paid?'checked':'')+' aria-label="Mark '+esc(x.bill.n)+' paid"><span class="date">'+x.date.toLocaleDateString('en-AU',{weekday:'short'})+' '+x.date.getDate()+'</span><span class="name">'+esc(x.bill.n)+'</span><span class="amount">'+money(x.bill.a)+'</span></label>'});html+='<div class="tot"><span>Total payments</span><span>'+money(total)+'</span></div><div class="foot '+(remaining<0?'neg':'pos')+'"><span>'+(remaining<0?'Short by':'Remainder')+'</span><span>'+money(remaining)+'</span></div></section>'}return html+'</div>'}
function renderAdd(){return '<section class="panel"><h2>Add one payment</h2><div class="controls"><label>Name<input id="billName" placeholder="Electricity" maxlength="80"></label><label>Amount<input id="billAmount" type="number" min="0" step="0.01" placeholder="0.00"></label><label>Repeats<select id="billRepeat"><option value="once">Once</option><option value="monthly">Every month</option></select></label><label>Date / first due date<input id="billDate" type="date" value="'+iso(today)+'"></label><button class="primary" id="addBill">Add payment</button></div></section><section class="panel"><h2>Paste payments</h2><textarea id="pasteInput" class="paste" placeholder="18/11 Electricity 73.50&#10;26/11 Car insurance 220.00"></textarea><p class="hint">One payment per line: date (day/month), name, then amount.</p><p><button class="primary" id="pasteBills">Add pasted payments</button> <span id="pasteStatus" class="hint" role="status"></span></p></section>'}
function renderBills(){const bills=state.bills.slice().sort((a,b)=>(a.rec?Number(a.day):32)-(b.rec?Number(b.day):32)),monthly=sum(state.bills.filter(b=>b.rec));return '<section class="panel"><h2>All bills</h2><p class="hint">Monthly bills total '+money(monthly)+'. Update a due date or remove a payment.</p><div class="rowlist">'+(bills.length?bills.map(b=>'<div class="bill-row"><span class="name">'+esc(b.n)+' <span class="tag">'+(b.rec?'Monthly':'One-off')+'</span></span><input data-bill-date="'+esc(b.id)+'" type="'+(b.rec?'number':'date')+'" '+(b.rec?'min="1" max="31" value="'+esc(b.day)+'"':'value="'+esc(b.d||'')+'"')+' aria-label="Due date for '+esc(b.n)+'"><span>'+money(b.a)+'</span><button class="delete" data-delete="'+esc(b.id)+'" aria-label="Delete '+esc(b.n)+'">×</button></div>').join(''):'<p class="empty">No payments yet. Add one from Add payments.</p>')+'</div></section>'}
function editorRows(key){return state[key].map((x,i)=>'<div class="editor-row"><input data-name="'+key+'" data-index="'+i+'" value="'+esc(x.n)+'" aria-label="Name"><input data-amount="'+key+'" data-index="'+i+'" type="number" min="0" step="0.01" value="'+Number(x.a||0)+'" aria-label="Amount"><button class="delete" data-remove="'+key+'" data-index="'+i+'" aria-label="Remove item">×</button></div>').join('')}
function renderBudget(){return '<section class="panel"><h2>Payday and pay period</h2><label class="controls">Payday / first day of pay period<select id="payday">'+days.map((d,i)=>'<option value="'+i+'" '+(state.payday===i?'selected':'')+'>'+d+'</option>').join('')+'</select></label><p class="hint">Each pay period starts on this weekday and runs for seven days.</p></section><section class="panel"><h2>Weekly income · '+money(sum(state.income))+'</h2><div class="rowlist">'+editorRows('income')+'</div><p><button class="secondary" data-add="income">+ Add income</button></p></section><section class="panel"><h2>Weekly fixed costs · '+money(sum(state.weekly))+'</h2><div class="rowlist">'+editorRows('weekly')+'</div><p><button class="secondary" data-add="weekly">+ Add cost</button></p><p class="hint">Free money each pay period after fixed costs: <strong>'+money(budget())+'</strong></p></section>'}
function render(){const nav=document.getElementById('tabs');nav.innerHTML=tabs.map(t=>'<button type="button" data-tab="'+t[0]+'" aria-pressed="'+(tab===t[0])+'">'+t[1]+'</button>').join('');const view=document.getElementById('view');view.innerHTML=tab==='weeks'?renderWeeks():tab==='add'?renderAdd():tab==='bills'?renderBills():renderBudget();
// IMPORTANT: tab buttons live in #tabs, outside #view. Bind them on #tabs.
nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
view.querySelectorAll('[data-paid]').forEach(c=>c.onchange=()=>{if(c.checked)state.paid[c.dataset.paid]=1;else delete state.paid[c.dataset.paid];save();render()});
const add=document.getElementById('addBill');if(add)add.onclick=()=>{const n=document.getElementById('billName').value.trim(),a=Number(document.getElementById('billAmount').value),d=document.getElementById('billDate').value,rec=document.getElementById('billRepeat').value==='monthly';if(!n||!d||!Number.isFinite(a)||a<0){alert('Enter a name, a valid amount, and a date.');return}state.bills.push(rec?{id:uid(),n,a,rec:true,day:Number(d.slice(-2))}:{id:uid(),n,a,rec:false,d});save();tab='weeks';render()};
const paste=document.getElementById('pasteBills');if(paste)paste.onclick=()=>{let added=0,bad=0;document.getElementById('pasteInput').value.split(/\r?\n/).forEach(line=>{line=line.trim();if(!line)return;const m=line.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\s+(.+?)\s+\$?([\d,]*\.?\d+)$/);if(!m){bad++;return}let year=m[3]?Number(m[3]):today.getFullYear();if(year<100)year+=2000;let date=new Date(year,Number(m[2])-1,Number(m[1]));if(!m[3]&&date<addDays(weekStart(today,state.payday),-30))date=new Date(year+1,Number(m[2])-1,Number(m[1]));if(date.getDate()!==Number(m[1])){bad++;return}state.bills.push({id:uid(),n:m[4],a:Number(m[5].replace(/,/g,'')),rec:false,d:iso(date)});added++});save();document.getElementById('pasteStatus').textContent=added+' added; '+bad+' line(s) could not be read.';if(added){tab='weeks';render()}};
view.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{state.bills=state.bills.filter(x=>x.id!==b.dataset.delete);save();render()});view.querySelectorAll('[data-bill-date]').forEach(input=>input.onchange=()=>{const bill=state.bills.find(x=>x.id===input.dataset.billDate);if(!bill)return;if(bill.rec){const day=Number(input.value);if(!Number.isInteger(day)||day<1||day>31){alert('Enter a day from 1 to 31.');render();return}bill.day=day}else bill.d=input.value;save();render()});
const payday=document.getElementById('payday');if(payday)payday.onchange=()=>{state.payday=Number(payday.value);save();render()};view.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{state[b.dataset.add].push({n:'New item',a:0});save();render()});view.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state[b.dataset.remove].splice(Number(b.dataset.index),1);save();render()});view.querySelectorAll('[data-name]').forEach(i=>i.onchange=()=>{state[i.dataset.name][Number(i.dataset.index)].n=i.value;save();render()});view.querySelectorAll('[data-amount]').forEach(i=>i.onchange=()=>{state[i.dataset.amount][Number(i.dataset.index)].a=Number(i.value)||0;save();render()})}
render();let installPrompt;const installWrap=document.getElementById('installWrap');window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;installWrap.hidden=false});document.getElementById('installBtn').onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installWrap.hidden=true};window.addEventListener('appinstalled',()=>{installWrap.hidden=true});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
